<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Hysteresis: pump starts below 30 percent and stops above 45 percent"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071510"/><stop offset=".55" stop-color="#0b2a22"/><stop offset="1" stop-color="#0b3a4a"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="glG"><stop offset="0" stop-color="#4ade80" stop-opacity=".5"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<radialGradient id="glB"><stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glA"><stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
</defs>
<rect width="900" height="440" fill="url(#bg)"/><rect width="900" height="440" fill="url(#grid)"/><text x="60" y="44" font-size="28" font-weight="800" fill="#eaf7ef" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Hysteresis control</text><text x="60" y="68" font-size="15" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">Two thresholds stop the pump from flickering around a single set-point</text><line x1="60" x2="760" y1="310.0" y2="310.0" stroke="#fff" stroke-opacity=".08"/><text x="48" y="315.0" text-anchor="end" font-size="13" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">0</text><line x1="60" x2="760" y1="240.0" y2="240.0" stroke="#fff" stroke-opacity=".08"/><text x="48" y="245.0" text-anchor="end" font-size="13" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">25</text><line x1="60" x2="760" y1="170.0" y2="170.0" stroke="#fff" stroke-opacity=".08"/><text x="48" y="175.0" text-anchor="end" font-size="13" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">50</text><line x1="60" x2="760" y1="100.0" y2="100.0" stroke="#fff" stroke-opacity=".08"/><text x="48" y="105.0" text-anchor="end" font-size="13" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">75</text><line x1="60" x2="760" y1="184.0" y2="184.0" stroke="#4ade80" stroke-width="2" stroke-dasharray="8 6"/><text x="770" y="189.0" font-size="15" font-weight="700" fill="#4ade80" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">OFF above 45 %</text><line x1="60" x2="760" y1="226.0" y2="226.0" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/><text x="770" y="231.0" font-size="15" font-weight="700" fill="#fb7185" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">ON below 30 %</text><rect x="257" y="40" width="317" height="270" fill="#38bdf8" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0;.2;.2;0" keyTimes="0;0.311;0.312;0.750;0.751" dur="9s" repeatCount="indefinite"/></rect><path d="M60 90 C170 100 230 250 330 256 C430 262 500 250 560 196 C620 142 690 138 760 128" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-dasharray="784" stroke-dashoffset="784"><animate attributeName="stroke-dashoffset" values="784;0;0" keyTimes="0;.95;1" dur="9s" repeatCount="indefinite"/></path><g><circle r="22" fill="url(#glG)"/><circle r="8" fill="#fff"/><animateMotion dur="9s" repeatCount="indefinite" path="M60 90 C170 100 230 250 330 256 C430 262 500 250 560 196 C620 142 690 138 760 128" keyPoints="0;1;1" keyTimes="0;.95;1" calcMode="linear"/></g><g opacity="0"><rect x="330" y="350" width="240" height="46" rx="23" fill="#93b3a3" fill-opacity=".18" stroke="#93b3a3" stroke-width="2"/><text x="450" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">PUMP OFF  ·  soil is fine</text><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.311;0.750" dur="9s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="330" y="350" width="240" height="46" rx="23" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="450" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#38bdf8" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">PUMP ON  ·  watering</text><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.311;0.750" dur="9s" repeatCount="indefinite" calcMode="discrete"/></g><text x="60" y="345" font-size="13" fill="#93b3a3" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">soil moisture (%) over time →</text></svg>